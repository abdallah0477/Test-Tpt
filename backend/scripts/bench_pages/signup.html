<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create account</title></head>
<body>
<header><nav id="top"><a href="/">Home</a><a href="/login">Sign in</a></nav></header>
<main>
  <h1>Create your account</h1>
  <form id="signup" action="/register" method="post">
    <label for="full-name">Full name</label>
    <input id="full-name" name="full_name" type="text" required maxlength="80">
    <label for="su-email">Email</label>
    <input id="su-email" name="email" type="email" placeholder="name@example.com" required>
    <label for="su-password">Password</label>
    <input id="su-password" name="password" type="password" minlength="10" required aria-describedby="pw-hint">
    <p id="pw-hint">At least 10 characters.</p>
    <label for="su-confirm">Confirm password</label>
    <input id="su-confirm" name="password_confirm" type="password" minlength="10" required>
    <label for="country">Country</label>
    <select id="country" name="country" required>
      <option value="">Choose…</option><option value="eg">Egypt</option><option value="de">Germany</option>
    </select>
    <label for="birth">Date of birth</label>
    <input id="birth" name="birth_date" type="date">
    <label><input type="checkbox" name="terms" required> I accept the terms</label>
    <label><input type="radio" name="plan" value="free" checked> Free</label>
    <label><input type="radio" name="plan" value="pro"> Pro</label>
    <button type="submit" data-testid="signup-submit">Create account</button>
  </form>
</main>
<footer><a href="/privacy">Privacy</a></footer>
</body>
</html>
