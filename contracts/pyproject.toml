[project]
name = "contracts"
version = "0.1.0"
description = "Shared Pydantic models for the backend and the Runner (AD-3)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14.4,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
