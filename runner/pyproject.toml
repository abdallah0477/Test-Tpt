[project]
name = "runner"
version = "0.1.0"
description = "Isolated Playwright Runner: inspection API, extraction and locators"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contracts",
    "playwright==1.65.2",
    "pytest-playwright==0.10.0",
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
    "sse-starlette==3.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.uv.sources]
contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["contracts"]
